<!DOCTYPE html>
<html lang="pt-BR"> <!-- Define  otipo de documento como HTML5 e a lingua da página como portugues do brasil-->

<head>
	<meta charset="UTF-8"> <!--Conjunto de caracteres da página-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Configuração para dispostivos móveis-->
	<title>Lista de Produtos</title><!--Titulo da página-->
</head>

<body>
	<h2>Lista de Produtos - HTML/JavaScript</h2> <!-- Titulo principal da página-->
	<!--Table qe exibira a lista de produtos-->
	<table id="produtosTable" border="1">
		<thead>
			<tr>
				<th>ID</th> <!-- Cabeçalho da coluna ID-->
				<th>Nome</th><!--Cabeçalho da coluna Nome-->
				<th>Preço</th><!--Cabeçalho da coluna Preço-->
			</tr>
		</thead>
		<tbody>
			<!-- Linhas da tabela serão inseraidas aqui-->
		</tbody>
	</table>

	<!--Mensagem de erro-->
	<div id="erroMensagem" style="color: red; display: none;"> <!--Div para exibir mensagem de erro-->
		Erro ao buscar produtos. por favor, tente novamente mais tarde.
	</div>
	<!--Ttoal de produtos-->
	<div id="totalProdutos">Total de Produtos: 0</div> <!--Div para exibir total de produtos-->

	<!--Função javaScript (similiar aos metodos java-->
	<script>
		// Função para listar os produtos
		function listarProdutos() {
			// Faz uma requisição GET para o endpoint de produtos
			fetch('http://localhost:8080/produtos')// URL do endpoint
				.then(response => {
					if (!response.ok) {
						throw new Error('erro na rede: ' + response.status);
					}
					// Converte a resposta para JSON
					return response.json(); // Converte a resposta para JSON
				})
				.then(data => {
					// Obtem o corpo da tabela
					const tableBody = document.getElementById('produtosTable').getElementsByTagName('tbody')[0];
					let totalprodutos = 0; // inicializa o contator de produtos
					data.forEach(produto => {
						const row = tableBody.insertRow();
						const cellId = row.insertCell(0);
						const cellNome = row.insertCell(1);
						const cellPreco = row.insertCell(2);

						cellId.textContent = produto.id;
						cellNome.textContent = produto.nome;
						cellPreco.textContent = produto.preco;
						totalprodutos++
					});
					document.getElementById('totalProdutos').textContent = 'Total de Produtos: ' + totalprodutos;
				})
				.catch(error => {
					console.error('Erro ao buscar produtos: ', error); // exibe o erro no console
					// Exibe a mensagem de erro
					document.getElementById('erroMensagem').style.display = 'block';

				});
		}
		// Executa a função listarProdutos quando a paogina é carregada
		document.addEventListener('DOMContentLoaded', listarProdutos);
	</script>
</body>

</html>
